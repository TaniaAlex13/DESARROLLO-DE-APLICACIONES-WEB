{% extends "base.html" %}

{% block content %}

<div class="container mt-5">

    <div class="card shadow">
        <div class="card-body text-center">

            <h2 class="mb-3">
                Bienvenido al Sistema de Gestión Comercial
            </h2>

            <p class="lead">
                Usuario autenticado:
                <strong>{{ current_user.usuario }}</strong>
            </p>

            <p>
                Has iniciado sesión correctamente.
            </p>

            <a href="{{ url_for('productos') }}" class="btn btn-primary">
                Ir a Productos
            </a>

            <a href="{{ url_for('logout') }}" class="btn btn-danger">
                Cerrar sesión
            </a>

        </div>
    </div>

</div>

{% endblock %}
