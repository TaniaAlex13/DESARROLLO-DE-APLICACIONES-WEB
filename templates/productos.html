{% extends "base.html" %}

{% block title %}
Productos
{% endblock %}

{% block content %}

<h2 class="text-center mb-4">Productos</h2>

<div class="row">

    <div class="col-md-4 mb-3">

        <div class="card h-100">

            <div class="card-body">

                <h5 class="card-title">Computadora</h5>

                <p class="card-text">
                    Equipo informático para trabajo y estudio.
                </p>

                <span class="badge bg-primary">
                    Tecnología
                </span>

            </div>

        </div>

    </div>


    <div class="col-md-4 mb-3">

        <div class="card h-100">

            <div class="card-body">

                <h5 class="card-title">Impresora</h5>

                <p class="card-text">
                    Impresora multifuncional para documentos.
                </p>

                <span class="badge bg-success">
                    Oficina
                </span>

            </div>

        </div>

    </div>


    <div class="col-md-4 mb-3">

        <div class="card h-100">

            <div class="card-body">

                <h5 class="card-title">Teclado</h5>

                <p class="card-text">
                    Teclado USB para computadora.
                </p>

                <span class="badge bg-warning text-dark">
                    Accesorios
                </span>

            </div>

        </div>

    </div>

</div>

{% endblock %}
